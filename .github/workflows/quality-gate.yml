name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cursor/**"]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate use server exports
        run: npm run check:server-actions
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"